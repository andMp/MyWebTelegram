<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Мій Telegram</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            display: flex;
            height: 100vh;
            background-color: #e5e5e5;
        }

        .sidebar {
            width: 300px;
            background-color: #fff;
            border-right: 1px solid #ccc;
            padding: 1rem;
            overflow-y: auto;
        }

            .sidebar h2 {
                color: #2aabee;
                margin-top: 0;
            }

        .chat-item {
            padding: 10px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
        }

            .chat-item:hover {
                background-color: #f1f1f1;
            }

        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: #f7f7f7;
        }

        .header {
            padding: 1rem;
            background-color: #2aabee;
            color: white;
            font-size: 1.2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logout-button {
            background-color: transparent;
            border: 1.5px solid white;
            color: white;
            padding: 5px 12px;
            border-radius: 5px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

            .logout-button:hover {
                background-color: white;
                color: #2aabee;
            }

        .messages {
            flex: 1;
            padding: 1rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            color: gray;
            font-size: 1.1rem;
            position: relative;
        }

        .input-area {
            display: flex;
            padding: 1rem;
            background-color: #fff;
            border-top: 1px solid #ccc;
        }

            .input-area input {
                flex: 1;
                padding: 10px;
                border-radius: 5px;
                border: 1px solid #ccc;
                margin-right: 10px;
            }

            .input-area button {
                background-color: #2aabee;
                border: none;
                color: white;
                padding: 10px 15px;
                border-radius: 5px;
                cursor: pointer;
            }

        .placeholder {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            color: gray;
            font-size: 1.2rem;
            user-select: none;
        }
        .message {
            margin: 0.3rem 0;
            padding: 0.6rem 1rem;
            border-radius: 10px;
            max-width: 75%;
            word-wrap: break-word;
            position: relative;
            font-size: 1rem;
            line-height: 1.3;
        }

        .sent {
            background-color: #2aabee;
            color: white;
            align-self: flex-end; /* вирівняти праворуч */
            border-bottom-right-radius: 0;
        }

        .received {
            background-color: #e1e1e1;
            color: black;
            align-self: flex-start; /* вирівняти ліворуч */
            border-bottom-left-radius: 0;
        }

        .timestamp {
            display: block;
            font-size: 0.75rem;
            color: #555;
            margin-top: 0.2rem;
            text-align: right;
            user-select: none;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>Чати</h2>
        <button onclick="addUser()" style="width: 100%; padding: 10px; margin-bottom: 1rem; background-color: #2aabee; color: white; border: none; border-radius: 5px; cursor: pointer;">
            ➕ Додати користувача
        </button>
        <div id="chats"></div>
    </div>

    <div class="main">
        <div class="header">
            Мій Telegram
            <button class="logout-button" onclick="logout()">Вихід</button>
        </div>
        <div class="messages" id="messages">
            <div class="placeholder" id="placeholder">Виберіть чат, щоб почати спілкування</div>
            <div id="messagesList" style="flex:1; display:flex; flex-direction: column; overflow-y: auto; color: gray; font-size: 1.1rem;"></div>
        </div>
        <div class="input-area">
            <input type="text" id="messageInput" placeholder="Введіть повідомлення...">
            <button onclick="sendMessage()">Надіслати</button>
        </div>
    </div>

    <script>
        const userId = localStorage.getItem("userId");

        if (!userId) {
            alert("Будь ласка, увійдіть у систему");
            window.location.href = "index.html";
        } else {
            loadChats();
        }

        function logout() {
            localStorage.removeItem("userId");
            localStorage.removeItem("currentChatId");
            window.location.href = "index.html";
        }

        function formatTime(dateStr) {
            const date = new Date(dateStr);
            const h = String(date.getHours()).padStart(2, '0');
            const m = String(date.getMinutes()).padStart(2, '0');
            const s = String(date.getSeconds()).padStart(2, '0');
            return `${h}:${m}:${s}`;
        }

        function createMessageElement(msg) {
            const div = document.createElement('div');
            div.classList.add('message');

            const senderId = msg.senderId ?? msg.SenderId ?? null;
            console.log('Message sender:', senderId, 'Current user:', userId);
            if (senderId?.toString() === userId.toString()) {
                div.classList.add('sent');
            } else {
                div.classList.add('received');
            }

            div.textContent = msg.text;

            const timeSpan = document.createElement('span');
            timeSpan.classList.add('timestamp');
            timeSpan.textContent = formatTime(msg.sentAt || new Date());
            div.appendChild(timeSpan);

            return div;
        }

        function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            if (message === '') return;

            if (!window.currentChatId) {
                alert("Оберіть чат!");
                return;
            }

            fetch(`/api/users/${window.currentChatId}/messages`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ senderId: userId, text: message })
            })
                .then(res => {
                    if (!res.ok) throw new Error("Помилка при відправленні повідомлення");
                    return res.json();
                })
                .then(savedMsg => {
                    const placeholder = document.getElementById('placeholder');
                    const messagesList = document.getElementById('messagesList');

                    // Приховуємо placeholder, якщо він показаний
                    placeholder.style.display = 'none';

                    // Змінюємо колір тексту на чорний, якщо був сірий (для messagesList)
                    messagesList.style.color = 'black';

                    // Додаємо нове повідомлення
                    savedMsg.senderId = userId;
                    const newMsg = createMessageElement(savedMsg);
                    messagesList.appendChild(newMsg);

                    input.value = '';
                    messagesList.scrollTop = messagesList.scrollHeight; // Прокрутка вниз
                })
                .catch(err => alert(err.message));
        }

        function addUser() {
            const phone = prompt("Введіть номер телефону користувача:");
            if (!phone) return;

            fetch(`/api/users/find-or-create-chat?phone=${encodeURIComponent(phone)}&currentUserId=${userId}`, {
                method: 'POST'
            })
                .then(res => {
                    if (!res.ok) throw new Error("Користувача не знайдено або сталася помилка.");
                    return res.json();
                })
                .then(chat => {
                    appendChatToSidebar(chat);
                })
                .catch(err => {
                    alert(err.message);
                });
        }

        function appendChatToSidebar(chat) {
            const chatsDiv = document.getElementById('chats');
            const chatItem = document.createElement('div');
            chatItem.className = 'chat-item';

            const chatName = chat.isGroup
                ? (chat.chatName ?? "Груповий чат")
                : "Чат з " + (chat.displayName || "Невідомо");

            chatItem.textContent = chatName;
            chatItem.onclick = () => openChatWith(chat.chatId, chat.displayName);
            chatsDiv.appendChild(chatItem);
        }

        function loadChats() {
            fetch(`/api/users/user-chats/${userId}`)
                .then(res => {
                    if (!res.ok) throw new Error("Не вдалося завантажити чати.");
                    return res.json();
                })
                .then(chats => {
                    const chatsDiv = document.getElementById('chats');
                    chatsDiv.innerHTML = '';
                    chats.forEach(chat => appendChatToSidebar(chat));
                })
                .catch(err => {
                    console.error("Помилка при завантаженні чатів:", err.message);
                    const msg = err.message.includes("Не вдалося завантажити чати")
                        ? err.message
                        : "Не вдалося завантажити чати: " + err.message;
                    alert(msg);
                });
            const savedChatId = localStorage.getItem('currentChatId');
            if (savedChatId) {
                // Затримка, щоб чати встигли відрендеритися
                setTimeout(() => {
                    openChatWith(savedChatId);
                }, 500);
            }
        }

        function openChatWith(chatId, username) {
            window.currentChatId = chatId;
            localStorage.setItem('currentChatId', chatId); // ЗБЕРЕГТИ chatId

            const placeholder = document.getElementById('placeholder');
            const messagesList = document.getElementById('messagesList');

            placeholder.style.display = 'none';
            messagesList.innerHTML = '';
            messagesList.style.color = 'black';

            fetch(`/api/users/${chatId}/messages`)
                .then(res => {
                    if (!res.ok) throw new Error("Помилка при завантаженні повідомлень.");
                    return res.json();
                })
                .then(data => {
                    if (data.length === 0) {
                        messagesList.innerHTML = '<div class="placeholder">Повідомлень немає</div>';
                        return;
                    }
                    data.forEach(msg => {
                        const messageEl = createMessageElement(msg);
                        messagesList.appendChild(messageEl);
                    });
                    messagesList.scrollTop = messagesList.scrollHeight;
                })
                .catch(err => alert(err.message));
        }

        function resetMessagesArea() {
            window.currentChatId = null;
            const placeholder = document.getElementById('placeholder');
            const messagesList = document.getElementById('messagesList');
            messagesList.innerHTML = '';
            placeholder.style.display = 'flex';
        }
        function renderMessage(message) {
            const messageDiv = document.createElement('div');
            messageDiv.classList.add('message');

            if (message.senderId === userId) {
                messageDiv.classList.add('right');
            } else {
                messageDiv.classList.add('left');
            }
            messageDiv.textContent = message.text;
            document.getElementById('chat-box').appendChild(messageDiv);
        }

    </script>
</body>
</html>
